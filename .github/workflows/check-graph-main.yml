name: Check graph-editor against narrowed core

on:
  push:
    branches:
      - refactor/narrow-editor-kernel
    paths:
      - .github/workflows/check-graph-main.yml

permissions:
  contents: write

jobs:
  graph-source-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out narrowed editor-core
        uses: actions/checkout@v6
        with:
          ref: refactor/narrow-editor-kernel
          path: editor-core
          fetch-depth: 0
      - name: Check out graph-editor main
        uses: actions/checkout@v6
        with:
          repository: moritzbrantner/graph-editor
          ref: main
          path: graph-editor
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Verify graph-editor against this exact core source
        working-directory: graph-editor
        env:
          EDITOR_CORE_SOURCE: ${{ github.workspace }}/editor-core
        run: bun run verify:source
      - name: Remove one-shot compatibility workflow
        working-directory: editor-core
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/check-graph-main.yml
          git commit -m "ci: record graph-editor source compatibility"
          git push origin HEAD:refactor/narrow-editor-kernel
