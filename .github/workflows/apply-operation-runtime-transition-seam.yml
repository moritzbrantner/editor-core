name: Apply operation runtime transition seam

on:
  push:
    branches:
      - refactor/narrow-editor-kernel
    paths:
      - .github/workflows/apply-operation-runtime-transition-seam.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/narrow-editor-kernel
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Add invariant-preserving operation runtime transitions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          types = Path('src/operations/types.ts')
          text = types.read_text()
          old = '''export type ApplyEditorOperationOptions = {\n  merge?: boolean;\n};\n\nexport type ApplyEditorInteractionOperationOptions = {'''
          new = '''export type ApplyEditorOperationOptions = {\n  merge?: boolean;\n  recordHistory?: boolean;\n};\n\nexport type ReplaceEditorOperationRuntimeCoreStateOptions = {\n  clearOperationHistory?: boolean;\n};\n\nexport type ApplyEditorInteractionOperationOptions = {'''
          assert text.count(old) == 1, 'unexpected ApplyEditorOperationOptions shape'
          types.write_text(text.replace(old, new))

          runtime = Path('src/operations/runtime.ts')
          text = runtime.read_text()
          old = '''  type CommitEditorRuntimeOptions,\n  type EditorRuntimeSelection,\n} from "../runtime.js";'''
          new = '''  type CommitEditorRuntimeOptions,\n  type EditorRuntimeSelection,\n  type EditorRuntimeState,\n} from "../runtime.js";'''
          assert text.count(old) == 1, 'unexpected runtime import shape'
          text = text.replace(old, new)

          old = '''  EditorOperationRuntimeOptions,\n  EditorOperationRuntimeState,\n} from "./types.js";'''
          new = '''  EditorOperationRuntimeOptions,\n  EditorOperationRuntimeState,\n  ReplaceEditorOperationRuntimeCoreStateOptions,\n} from "./types.js";'''
          assert text.count(old) == 1, 'unexpected operations type import shape'
          text = text.replace(old, new)

          marker = '''export function applyEditorOperation<TDocument, TSelection = unknown>(\n'''
          addition = '''export function replaceEditorOperationRuntimeCoreState<TDocument, TSelection = unknown>(\n  state: EditorOperationRuntimeState<TDocument, TSelection>,\n  runtime: EditorRuntimeState<TDocument, TSelection>,\n  options: ReplaceEditorOperationRuntimeCoreStateOptions = {},\n): EditorOperationRuntimeState<TDocument, TSelection> {\n  const runtimeOptions = getOperationRuntimeOptions(state);\n  const operationHistory = options.clearOperationHistory\n    ? createEditorTransactionHistory<TDocument, TSelection>()\n    : state.operationHistory;\n\n  return withOperationRuntimeFlags(\n    {\n      issues: [],\n      lastMergeKey: options.clearOperationHistory ? null : state.lastMergeKey,\n      operationHistory,\n      runtime,\n    },\n    runtimeOptions,\n  );\n}\n\n'''
          assert text.count(marker) == 1, 'unexpected applyEditorOperation marker'
          text = text.replace(marker, addition + marker)

          old = '''      operationHistory: pushOrMergeOperationTransaction(state, transaction, options),\n      runtime,\n'''
          new = '''      operationHistory:\n        options.recordHistory === false\n          ? state.operationHistory\n          : pushOrMergeOperationTransaction(state, transaction, options),\n      runtime,\n'''
          assert text.count(old) == 1, 'unexpected operation history write shape'
          runtime.write_text(text.replace(old, new))
          PY

          cat > src/operation-runtime-transitions.test.ts <<'EOF'
          import { describe, expect, test } from "vitest";
          import {
            applyEditorOperation,
            createEditorOperationRuntime,
            replaceEditorOperationRuntimeCoreState,
            undoEditorOperationRuntime,
          } from "./operations.js";
          import { resetEditorRuntime } from "./runtime.js";

          describe("operation runtime transitions", () => {
            test("applies semantic changes without recording a new operation-history entry", () => {
              let editor = createEditorOperationRuntime<{ value: number }>({
                initialDocument: { value: 0 },
              });
              editor = applyEditorOperation(editor, {
                id: "recorded",
                apply: () => ({ value: 1 }),
              });
              const history = editor.operationHistory;

              editor = applyEditorOperation(
                editor,
                {
                  id: "unrecorded",
                  apply: () => ({ value: 2 }),
                },
                { recordHistory: false },
              );

              expect(editor.runtime.document).toEqual({ value: 2 });
              expect(editor.operationHistory).toBe(history);
              expect(editor.operationHistory.undoStack).toHaveLength(1);
              expect(editor.canUndo).toBe(true);
              expect(undoEditorOperationRuntime(editor).runtime.document).toEqual({ value: 0 });
            });

            test("replaces core runtime state without breaking opaque runtime ownership", () => {
              let editor = createEditorOperationRuntime<{ value: number }, string>({
                initialDocument: { value: 0 },
                initialSelection: "a",
              });
              editor = applyEditorOperation(editor, {
                id: "recorded",
                apply: () => ({ value: 1 }),
                selectionAfter: "b",
              });

              const resetRuntime = resetEditorRuntime(editor.runtime, { value: 9 }, {
                markSaved: true,
                selection: "c",
              });
              editor = replaceEditorOperationRuntimeCoreState(editor, resetRuntime, {
                clearOperationHistory: true,
              });

              expect(editor.runtime.document).toEqual({ value: 9 });
              expect(editor.runtime.selection).toBe("c");
              expect(editor.operationHistory.undoStack).toEqual([]);
              expect(editor.canUndo).toBe(false);
              expect(editor.lastMergeKey).toBeNull();

              editor = applyEditorOperation(editor, {
                id: "after-replace",
                apply: () => ({ value: 10 }),
              });
              expect(editor.runtime.document).toEqual({ value: 10 });
              expect(editor.canUndo).toBe(true);
            });
          });
          EOF
      - run: bun run format
      - run: bun run check-types
      - run: bun run test:unit
      - name: Commit seam
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-operation-runtime-transition-seam.yml
          git add src/operations/types.ts src/operations/runtime.ts src/operation-runtime-transitions.test.ts
          git commit -m "feat: add invariant-preserving operation runtime transitions"
          git push origin HEAD:refactor/narrow-editor-kernel
