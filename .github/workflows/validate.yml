name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee # workflow-standard-v1.2
    permissions:
      contents: read
      packages: read
    with:
      bun_version: "1.4.0"
      install_command: "bun install --frozen-lockfile"
      pre_command: "bun run architecture:check"
      format_command: "bun run format:check"
      lint_command: "bun run lint"
      typecheck_command: "bun run check-types"
      build_command: "bun run build"
      unit_test_command: "bun run test:unit"

  integration-validation:
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee # workflow-standard-v1.2
    permissions:
      contents: read
      packages: read
    with:
      bun_version: "1.4.0"
      install_command: "bun install --frozen-lockfile"
      integration_command: "bun run test:integration"
      package_check_command: "bun run pack:check && bun run verify:git-install"
      artifact_paths: ""

  node24-package-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Smoke package exports on Node 24
        run: node scripts/smoke-package-exports.mjs
        env:
          EDITOR_CORE_COMPAT_NODE_BIN: node

  clean-consumers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run clean-consumer fixtures
        run: bun run test:consumers

      - name: Upload clean-consumer logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: clean-consumer-logs
          path: test-results/clean-consumers

  e2e-validation:
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee # workflow-standard-v1.2
    permissions:
      contents: read
      packages: read
    with:
      bun_version: "1.4.0"
      install_command: "bun install --frozen-lockfile"
      build_command: "bun run build && bun run example:build"
      install_playwright: true
      e2e_command: "bun run test:e2e:run"
      artifact_paths: |
        playwright-report
        test-results

  storybook-validation:
    uses: moritzbrantner/reusable-workflows/.github/workflows/storybook-validation.yml@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee # workflow-standard-v1.2
    permissions:
      contents: read
      packages: read
    with:
      bun_version: "1.4.0"
      install_command: "bun install --frozen-lockfile"
      storybook_build_command: "bun run storybook:build"
      storybook_test_command: "bun run test:storybook:ci"
      install_playwright: true
      artifact_paths: |
        storybook-static
        playwright-report
        test-results

  performance-validation:
    uses: moritzbrantner/reusable-workflows/.github/workflows/performance-validation.yml@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee # workflow-standard-v1.2
    permissions:
      contents: read
      packages: read
    with:
      bun_version: "1.4.0"
      install_command: "bun install --frozen-lockfile"
      build_command: "bun run example:build"
      unlighthouse_command: "bun run unlighthouse:ci"
      benchmark_command: "bun run bench:check"
      bundle_size_command: "bun run size:check"
      artifact_paths: |
        .unlighthouse
        playwright-report
        test-results
        storybook-static
