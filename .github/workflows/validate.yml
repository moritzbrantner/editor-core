name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@workflow-standard-v1.2
    permissions:
      contents: read
      packages: read
    secrets: inherit
    with:
      bun_version: "1.4.0"
      install_command: "bun install --frozen-lockfile"
      pre_command: "bun run architecture:check"
      format_command: "bun run format:check"
      lint_command: "bun run lint"
      typecheck_command: "bun run check-types"
      unit_test_command: "bun run test:unit"

  build-package:
    name: Build or reuse package
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@544af51c921b09b4452b7346347ec9effa58f179
    secrets: inherit
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: editor-core-package-v1
      node_version: "24"
      bun_version: "1.4.0"
      cache_bun: true
      bun_cache_dependency_path: bun.lock
      setup_command: "bun install --frozen-lockfile"
      build_command: "bun run build"
      artifact_paths: dist
      reuse_across_runs: true
      artifact_retention_days: 7

  integration-validation:
    needs: build-package
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@544af51c921b09b4452b7346347ec9effa58f179
    permissions:
      actions: read
      contents: read
      packages: read
    secrets: inherit
    with:
      bun_version: "1.4.0"
      install_command: "bun install --frozen-lockfile"
      prebuilt_artifact_run_id: ${{ needs.build-package.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.build-package.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.build-package.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.build-package.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.build-package.outputs.identity_digest }}
      prebuilt_artifact_destination: dist
      integration_command: "bun run smoke:package && node scripts/check-api-snapshot.mjs"
      package_check_command: "bun run pack:check"
      artifact_paths: ""

  node24-package-smoke:
    needs: build-package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.build-package.outputs.source_sha }}

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Consume verified package
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@544af51c921b09b4452b7346347ec9effa58f179
        with:
          producer_run_id: ${{ needs.build-package.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-package.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
          source_sha: ${{ needs.build-package.outputs.source_sha }}
          artifact_key: ${{ needs.build-package.outputs.artifact_key }}
          identity_digest: ${{ needs.build-package.outputs.identity_digest }}
          destination_path: dist
          github_token: ${{ github.token }}

      - name: Smoke package exports on Node 24
        run: node scripts/smoke-package-exports.mjs
        env:
          EDITOR_CORE_COMPAT_NODE_BIN: node

  e2e-validation:
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@workflow-standard-v1.2
    permissions:
      contents: read
      packages: read
    secrets: inherit
    with:
      bun_version: "1.4.0"
      install_command: "bun install --frozen-lockfile"
      build_command: "bun run example:build"
      install_playwright: true
      e2e_command: "bun run test:e2e:run"
      artifact_paths: |
        playwright-report
        test-results

  storybook-validation:
    uses: moritzbrantner/reusable-workflows/.github/workflows/storybook-validation.yml@workflow-standard-v1.2
    permissions:
      contents: read
      packages: read
    secrets: inherit
    with:
      bun_version: "1.4.0"
      install_command: "bun install --frozen-lockfile"
      storybook_build_command: "bun run storybook:build"
      storybook_test_command: "bun run test:storybook:ci"
      install_playwright: true
      artifact_paths: |
        storybook-static
        playwright-report
        test-results

  performance-validation:
    uses: moritzbrantner/reusable-workflows/.github/workflows/performance-validation.yml@workflow-standard-v1.2
    permissions:
      contents: read
      packages: read
    secrets: inherit
    with:
      bun_version: "1.4.0"
      install_command: "bun install --frozen-lockfile"
      build_command: "bun run example:build"
      unlighthouse_command: "bun run unlighthouse:ci"
      benchmark_command: "bun run bench:check"
      bundle_size_command: "bun run size:check"
      artifact_paths: |
        .unlighthouse
        playwright-report
        test-results
        storybook-static
