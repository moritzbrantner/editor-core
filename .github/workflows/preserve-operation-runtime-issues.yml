name: Preserve operation issues across core-state replacement

on:
  push:
    branches:
      - refactor/narrow-editor-kernel
    paths:
      - .github/workflows/preserve-operation-runtime-issues.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/narrow-editor-kernel
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Preserve operation issues by default
        run: |
          python3 - <<'PY'
          from pathlib import Path

          types = Path('src/operations/types.ts')
          text = types.read_text()
          old = '''export type ReplaceEditorOperationRuntimeCoreStateOptions = {\n  clearOperationHistory?: boolean;\n};'''
          new = '''export type ReplaceEditorOperationRuntimeCoreStateOptions = {\n  clearIssues?: boolean;\n  clearOperationHistory?: boolean;\n};'''
          assert text.count(old) == 1
          types.write_text(text.replace(old, new))

          runtime = Path('src/operations/runtime.ts')
          text = runtime.read_text()
          old = '''      issues: [],\n      lastMergeKey: options.clearOperationHistory ? null : state.lastMergeKey,'''
          new = '''      issues: options.clearIssues ? [] : state.issues,\n      lastMergeKey: options.clearOperationHistory ? null : state.lastMergeKey,'''
          assert text.count(old) == 1
          runtime.write_text(text.replace(old, new))

          test = Path('src/operation-runtime-transitions.test.ts')
          text = test.read_text()
          marker = '''    test("replaces core runtime state without breaking opaque runtime ownership", () => {'''
          addition = '''    test("preserves operation issues unless explicitly cleared", () => {\n      let editor = createEditorOperationRuntime<{ value: number }>({\n        initialDocument: { value: 0 },\n        preflight: () => [{ path: "$", message: "Blocked" }],\n      });\n      editor = applyEditorOperation(editor, {\n        id: "blocked",\n        apply: () => ({ value: 1 }),\n      });\n      expect(editor.issues).toEqual([{ path: "$", message: "Blocked" }]);\n\n      const replacement = resetEditorRuntime(editor.runtime, { value: 9 });\n      editor = replaceEditorOperationRuntimeCoreState(editor, replacement);\n      expect(editor.issues).toEqual([{ path: "$", message: "Blocked" }]);\n\n      editor = replaceEditorOperationRuntimeCoreState(editor, replacement, { clearIssues: true });\n      expect(editor.issues).toEqual([]);\n    });\n\n'''
          assert text.count(marker) == 1
          test.write_text(text.replace(marker, addition + marker))
          PY
      - run: bun run format
      - run: bun run build
      - run: bunx vitest run src/operation-runtime-transitions.test.ts
      - name: Commit issue-preservation semantics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/operations/types.ts src/operations/runtime.ts src/operation-runtime-transitions.test.ts
          git commit -m "fix: preserve operation issues across core-state replacement"
          git push origin HEAD:refactor/narrow-editor-kernel
