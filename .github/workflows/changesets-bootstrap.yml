name: Bootstrap Changesets

on:
  push:
    branches:
      - chore/add-changesets-conformance

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: chore/add-changesets-conformance
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Update package metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.scripts = pkg.scripts ?? {};
          pkg.scripts.changeset = 'changeset';
          pkg.devDependencies = pkg.devDependencies ?? {};
          pkg.devDependencies['@changesets/changelog-github'] = '^0.6.0';
          pkg.devDependencies['@changesets/cli'] = '^2.29.7';
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          bun install
          bunx oxfmt package.json .changeset/config.json
          git branch --force main origin/main
          bun run changeset status

      - name: Commit generated package metadata
        run: |
          if git diff --quiet -- package.json bun.lock .changeset/config.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock .changeset/config.json
          git commit -m "chore: add Changesets tooling"
          git push origin HEAD:chore/add-changesets-conformance
