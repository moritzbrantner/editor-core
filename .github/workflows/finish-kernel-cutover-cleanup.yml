name: Finish kernel cutover cleanup

on:
  push:
    branches:
      - refactor/narrow-editor-kernel
    paths:
      - .github/workflows/finish-kernel-cutover-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/narrow-editor-kernel
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Remove stale share example path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('examples/react/src/main.tsx')
          text = path.read_text()
          for line in [
            '  decodeEditorSharePayload,\n',
            '  editorShareTokenFromUrl,\n',
            '  editorShareUrl,\n',
            '  encodeEditorSharePayload,\n',
          ]:
            assert line in text, f'missing stale import: {line.strip()}'
            text = text.replace(line, '')

          text = text.replace(
            'type CommandId = EditorRuntimeCommandId | EditorDocumentIoCommandId | "share" | "template";',
            'type CommandId = EditorRuntimeCommandId | EditorDocumentIoCommandId | "template";',
          )
          text = text.replace(
            '  body: "Start drafting here. Change the title, adjust the accent, undo edits, and create a share URL from the current document state.",',
            '  body: "Start drafting here. Change the title, adjust the accent, undo edits, save locally, and export the current document as JSON.",',
          )
          assert '  const hasShareToken = editorShareTokenFromUrl(window.location.href) !== null;\n' in text
          text = text.replace('  const hasShareToken = editorShareTokenFromUrl(window.location.href) !== null;\n', '')
          assert '    loadOnMount: !hasShareToken,\n' in text
          text = text.replace('    loadOnMount: !hasShareToken,\n', '    loadOnMount: true,\n')

          start = text.index('  const shareDocument = React.useCallback(async () => {')
          end = text.index('  const downloadDocument = React.useCallback', start)
          text = text[:start] + text[end:]

          share_command = '''      {\n        hotkeys: ["Mod+S"],\n        id: "share",\n        label: "Share",\n        run: shareDocument,\n      },\n'''
          assert share_command in text
          text = text.replace(share_command, '')
          assert '[documentIoCommands, loadTemplate, runtimeCommands, shareDocument]' in text
          text = text.replace(
            '[documentIoCommands, loadTemplate, runtimeCommands, shareDocument]',
            '[documentIoCommands, loadTemplate, runtimeCommands]',
          )

          start = text.index('  React.useEffect(() => {\n    const token = editorShareTokenFromUrl(window.location.href);')
          end = text.index('  React.useEffect(() => {\n    if (persistence.status === "loaded"', start)
          text = text[:start] + text[end:]

          for stale in [
            'decodeEditorSharePayload',
            'editorShareTokenFromUrl',
            'editorShareUrl',
            'encodeEditorSharePayload',
            'shareDocument',
            '"share"',
          ]:
            assert stale not in text, f'stale share example reference remains: {stale}'
          path.write_text(text)
          PY
      - name: Apply repository formatter
        run: bun run format
      - name: Regenerate public API report
        run: bun run api:update
      - name: Verify cutover cleanup
        run: |
          bun run format:check
          bun run check-types
          bun run example:build
          bun run api:check
          bun run test:unit
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md benchmarks/core.bench.ts examples/react/src/main.tsx examples/react/src/reference-editor.tsx scripts/smoke-package-exports.mjs src/operations.test.ts src/reference-fixtures.test.ts src/selection.ts docs/api-report.md
          git diff --cached --check
          git commit -m "fix: finish domain-neutral kernel cutover"
          git push origin HEAD:refactor/narrow-editor-kernel
