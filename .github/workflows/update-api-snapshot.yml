name: Update API snapshot

on:
  push:
    branches:
      - refactor/narrow-editor-kernel
    paths:
      - .github/workflows/update-api-snapshot.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/narrow-editor-kernel
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run api:update
      - name: Commit API snapshot
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api-report.md
          git commit -m "docs: regenerate API report for persistence token export"
          git push origin HEAD:refactor/narrow-editor-kernel
