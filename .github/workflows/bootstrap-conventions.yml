name: Bootstrap conventions

on:
  push:
    branches:
      - chore/convergence-install-conventions

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout editor-core
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Checkout coding-tooling
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/coding-tooling
          ref: 5b9768c99c7011f98701ac030adb46a1b678aa59
          path: .bootstrap/coding-tooling

      - name: Checkout coding-agent-conventions
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/coding-agent-conventions
          ref: 21ae3d91a3a5c5c36e4c3618d13522f006208633
          path: .bootstrap/coding-agent-conventions

      - name: Install coding-tooling dependencies
        working-directory: .bootstrap/coding-tooling
        run: bun install --frozen-lockfile

      - name: Install canonical conventions
        run: |
          bun .bootstrap/coding-tooling/src/router.ts conventions init \
            benchmarking lighthouse playwright react storybook tooling typescript vite vitest \
            --root "$GITHUB_WORKSPACE" \
            --conventions-root "$GITHUB_WORKSPACE/.bootstrap/coding-agent-conventions" \
            --json

      - name: Verify installed convention snapshot
        run: |
          bun .bootstrap/coding-tooling/src/router.ts conventions check \
            --root "$GITHUB_WORKSPACE" \
            --json

      - name: Commit canonical generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conventions.json conventions.lock.json .conventions
          if git diff --cached --quiet; then
            echo "No convention changes generated"
            exit 0
          fi
          git commit -m "chore: install canonical conventions [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
