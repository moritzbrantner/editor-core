name: Bootstrap conventions

on:
  push:
    branches:
      - chore/convergence-install-conventions

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout editor-core
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Fetch pinned convergence tooling outside the repository
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/moritzbrantner/coding-tooling.git "$RUNNER_TEMP/coding-tooling"
          git -C "$RUNNER_TEMP/coding-tooling" fetch --depth=1 origin 5b9768c99c7011f98701ac030adb46a1b678aa59
          git -C "$RUNNER_TEMP/coding-tooling" checkout --detach 5b9768c99c7011f98701ac030adb46a1b678aa59
          git clone --filter=blob:none --no-checkout https://github.com/moritzbrantner/coding-agent-conventions.git "$RUNNER_TEMP/coding-agent-conventions"
          git -C "$RUNNER_TEMP/coding-agent-conventions" fetch --depth=1 origin 21ae3d91a3a5c5c36e4c3618d13522f006208633
          git -C "$RUNNER_TEMP/coding-agent-conventions" checkout --detach 21ae3d91a3a5c5c36e4c3618d13522f006208633

      - name: Install coding-tooling dependencies
        working-directory: ${{ runner.temp }}/coding-tooling
        run: bun install --frozen-lockfile

      - name: Install editor-core dependencies
        run: bun install --frozen-lockfile

      - name: Align executable convention lint runtime
        run: bun add --dev --exact oxlint@1.80.0

      - name: Install canonical conventions
        run: |
          bun "$RUNNER_TEMP/coding-tooling/src/router.ts" conventions init \
            benchmarking lighthouse playwright react storybook tooling typescript vite vitest \
            --root "$GITHUB_WORKSPACE" \
            --conventions-root "$RUNNER_TEMP/coding-agent-conventions" \
            --json

      - name: Verify installed convention snapshot
        run: |
          bun "$RUNNER_TEMP/coding-tooling/src/router.ts" conventions check \
            --root "$GITHUB_WORKSPACE" \
            --json

      - name: Run strict fast verification
        run: |
          bun "$RUNNER_TEMP/coding-tooling/src/router.ts" run \
            --root "$GITHUB_WORKSPACE" \
            --tier fast \
            --strict \
            --json

      - name: Commit canonical generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock conventions.json conventions.lock.json .conventions
          if git diff --cached --quiet; then
            echo "No convention changes generated"
            exit 0
          fi
          git commit -m "chore: install canonical conventions [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
